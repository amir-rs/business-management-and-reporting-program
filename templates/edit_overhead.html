{% extends "base.html" %}

{% block title %}ویرایش هزینه جانبی - سیستم مدیریت کافه{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>
                <i class="fas fa-edit me-2"></i>ویرایش هزینه جانبی
            </h1>
            <a href="{{ url_for('overhead') }}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-right me-2"></i>بازگشت به لیست
            </a>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">اطلاعات هزینه</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">نام هزینه</label>
                            <input type="text" class="form-control" name="name" value="{{ cost.name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">مبلغ (تومان)</label>
                            <input type="number" class="form-control" name="amount" step="1000" min="0" value="{{ '%.0f'|format(cost.amount) }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">دوره زمانی</label>
                            <select class="form-select" name="period" required>
                                <option value="monthly" {% if cost.period == 'monthly' %}selected{% endif %}>ماهانه</option>
                                <option value="daily" {% if cost.period == 'daily' %}selected{% endif %}>روزانه</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <a href="{{ url_for('overhead') }}" class="btn btn-outline-secondary me-2">انصراف</a>
                        <button type="submit" class="btn btn-primary">ذخیره</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
